<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SU Enterprises – Billing</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--bd:#d9dde3;--ac:#0b6b3a;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#20252b;--tx:#e8eaed;--mu:#9aa3ae;--bd:#363d46;--ac:#3fb56f;--dg:#ff8a80}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--dg)}button.on{border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}

#inv{background:#fff;color:#000;width:194mm;margin:0 auto;padding:6mm;border:1px solid #000;font:12px Arial,sans-serif;overflow-x:auto}

#inv .b td,#inv .b th{border:1px solid #000;padding:4px 5px;vertical-align:top}
#inv th{background:#eee}.r{text-align:right}.c{text-align:center}
.pv{overflow-x:auto}
@page{size:A4;margin:8mm}
@media print{
 html,body{background:#fff}.noprint{display:none!important}.wrap{padding:0;max-width:none}
 .pv{overflow:visible}#inv{width:100%;border:1px solid #000;padding:5mm;page-break-inside:avoid;break-inside:avoid}
}
</style></head><body><div class="wrap">
<div class="noprint">
<h1>SU Enterprises and Auto Sales – Billing <small style="color:var(--mu);font-weight:400">GSTIN: 09BJTPY9326G1Z7</small></h1>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">New Bill</button><button id="t2" onclick="tab(2)">All Records</button></div>
 
<div id="s1">

</div><div style="margin-top:8px"><label>Customer address</label><input id="ca" oninput="pv()"></div></div>

<div class="row" style="margin:0 0 12px"><button class="p" onclick="save(true)">Save &amp; Print</button><button onclick="save(false)">Save</button><button onclick="window.print()">Print only</button><button onclick="newBill()">New bill</button><button style="background:#25D366;color:#000;border-color:#25D366" onclick="sharePdf(this)">Share PDF on WhatsApp</button><button style="background:#25D366;color:#000;border-color:#25D366" onclick="sharePdf(this,'chat')">PDF + open customer's chat</button><button onclick="wa()">Send text only</button><label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx)"><input type="checkbox" id="aw" checked style="width:auto">Auto-share PDF on WhatsApp after Save &amp; Print</label></div>
</div>
 
<div id="s2" style="display:none"><div class="card">

<div class="row"><button class="p" onclick="xl()">Download Excel backup (.xlsx)</button><button onclick="$('xf').click()">Restore from Excel</button><input type="file" id="xf" accept=".xlsx,.xls" style="display:none" onchange="xr(this)"><button onclick="bk()">Copy backup of all records</button><button onclick="rs()">Restore from backup</button></div>

<div class="pv"><div id="inv"></div></div>

</div>
<script>
const S={n:'SU ENTERPRISES AND AUTO SALES',a:'TEMA RAHMAT, KURTHIYA, Khalilabad, Sant Kabir Nagar, Uttar Pradesh - 272175',g:'09BJTPY9326G1Z7',p:'BJTPY9326G',m:'8176027237',o:'Satyam Yadav'};
const M=[['ROSEN EBIKE SPORTZ MODEL (DRL)',23700,null,null,48037],['ROSEN EBIKE ELITE MODEL',25000,null,null,49610],['ROSEN EBIKE SPORTS PRO MODEL (ACTIVA)',33000,72600,76230,59290],['ROSEN EBIKE OLA MODEL',34000,73810,77440,60500],['ROSEN EBIKE Q-7 MODEL',37000,77440,81070,null],['ROSEN E-BIKE VECTOR MODEL',39000,79860,83490,null],['ROSEN E-BIKE CYBER MODEL',41000,82280,85910,null]];
const V=['Base price','with Lithium 60V/36AH Battery & Charger','with Lithium 60V/42AH Battery & Charger','with Lead Battery & Charger'];
const PL=[];M.forEach(m=>V.forEach((v,i)=>{if(m[i+1])PL.push({d:m[0]+' ('+v+')',r:m[i+1]})}));
const K='su_bills';let items=[],editId=null;
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const db=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};
const wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));return true}catch(e){alert('Could not save in this browser.');return false}};
const f2=n=>(Math.round(n*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function words(n){if(!n)return'Zero';const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const b=x=>x<20?o[x]:t[x/10|0]+(x%10?' '+o[x%10]:'');const c=x=>(x>99?o[x/100|0]+' Hundred'+(x%100?' ':''):'')+(x%100?b(x%100):'');let r='';[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']].forEach(([d,s])=>{if(n>=d){r+=c(Math.floor(n/d))+' '+s+' ';n%=d}});if(n)r+=c(n);return r.trim()}
function fy(d){const x=new Date(d),y=x.getFullYear(),s=x.getMonth()>2?y:y-1;return s+'-'+String(s+1).slice(2)}
function nextNo(d){const y=fy(d),mx=db().filter(b=>b.fy===y).reduce((m,b)=>Math.max(m,b.seq),0);return{fy:y,seq:mx+1,no:'SU/'+y+'/'+String(mx+1).padStart(4,'0')}}
function tab(n){$('s1').style.display=n==1?'':'none';$('s2').style.display=n==2?'':'none';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)list()}
function addRow(){items.push({d:'',q:1,r:0,s:''});rows()}
function rows(){$('rows').innerHTML=items.map((x,i)=>`<tr><td><select onchange="pick(${i},this.value)"><option value="">Select…</option>${PL.map((p,j)=>`<option value="${j}">${esc(p.d)} – ₹${p.r}</option>`).join('')}</select></td><td><input value="${esc(x.d)}" oninput="items[${i}].d=this.value;pv()"></td><td><input type="number" min="1" value="${x.q}" oninput="items[${i}].q=+this.value;pv()"></td><td><input type="number" value="${x.r}" oninput="items[${i}].r=+this.value;pv()"></td><td><input value="${esc(x.s)}" oninput="items[${i}].s=this.value;pv()"></td><td><button class="d" onclick="items.splice(${i},1);rows();pv()">✕</button></td></tr>`).join('');pv()}
function pick(i,j){if(j==='')return;items[i].d=PL[j].d;items[i].r=PL[j].r;rows()}
function collect(){const d=$('dt').value;return{id:editId,no:$('no').value,date:d,cn:$('cn').value,cm:$('cm').value,cg:$('cg').value,ca:$('ca').value,pm:$('pm').value,ds:+$('ds').value||0,gr:+$('gr').value||0,nt:$('nt').value,items:JSON.parse(JSON.stringify(items))}}
function calc(b){const sub=b.items.reduce((s,x)=>s+(x.q||0)*(x.r||0),0),net=Math.max(sub-b.ds,0),tot=Math.round(net),tx=net/(1+b.gr/100),gst=net-tx;return{sub,net,tot,ro:tot-net,tx,h:gst/2}}
function pv(){$('inv').innerHTML=inv(collect())}
function inv(b){const c=calc(b),dd=b.date?b.date.split('-').reverse().join('/'):'';
const rs=b.items.map((x,i)=>`<tr><td class="c">${i+1}</td><td>${esc(x.d)}${x.s?'<br><small>No: '+esc(x.s)+'</small>':''}</td><td class="c">87116020</td><td class="c">${x.q}</td><td class="r">${f2(x.r)}</td><td class="r">${f2(x.q*x.r)}</td></tr>`).join('');
const pad='<tr style="height:'+Math.max(0,(9-b.items.length))*7+'mm"><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
return`<table class="b"><tr><td colspan="6" class="c"><div style="font-size:18px;font-weight:bold">${S.n}</div>${S.a}<br>Mobile: ${S.m} | PAN: ${S.p}<div style="font-size:15px;margin-top:3px"><b>GSTIN: ${S.g}</b></div></td></tr>
<tr><td colspan="6" class="c"><b>TAX INVOICE</b></td></tr>
<tr><td colspan="3">Invoice No: <b>${esc(b.no)}</b><br>Date: <b>${dd}</b></td><td colspan="3">Place of Supply: Uttar Pradesh<br>Payment: ${esc(b.pm)}</td></tr>
<tr><td colspan="6"><b>Bill To:</b> ${esc(b.cn)||'-'}<br>${esc(b.ca)}<br>Mobile: ${esc(b.cm)}${b.cg?' | GSTIN: '+esc(b.cg):''}</td></tr>
<tr><th style="width:7%">S.No</th><th>Description of Goods</th><th style="width:13%">HSN</th><th style="width:7%">Qty</th><th style="width:14%">Rate (incl. GST)</th><th style="width:15%">Amount (₹)</th></tr>
${rs}${pad}
<tr><td colspan="4" rowspan="6" style="vertical-align:top">Amount in words:<br><b>Rupees ${words(c.tot)} Only</b>${b.nt?'<br><br>Note: '+esc(b.nt):''}</td><td class="r">Gross</td><td class="r">${f2(c.sub)}</td></tr>
<tr><td class="r">Discount</td><td class="r">${f2(b.ds)}</td></tr>
<tr><td class="r">Taxable value</td><td class="r">${f2(c.tx)}</td></tr>
<tr><td class="r">CGST ${b.gr/2}%</td><td class="r">${f2(c.h)}</td></tr>
<tr><td class="r">SGST ${b.gr/2}%</td><td class="r">${f2(c.h)}</td></tr>
<tr><td class="r"><b>Grand Total</b><br><small>Round off ${f2(c.ro)}</small></td><td class="r"><b>₹ ${f2(c.tot)}</b></td></tr>
<tr><td colspan="3" style="height:26mm"><b>Terms:</b><br>1. Goods once sold will not be taken back.<br>2. Battery warranty as per manufacturer.<br>3. Subject to Khalilabad jurisdiction.</td><td colspan="3" class="r" style="vertical-align:bottom">For <b>${S.n}</b><br><br><br>Authorised Signatory</td></tr></table>`}
function newBill(){editId=null;const d=new Date().toISOString().slice(0,10);$('dt').value=d;$('no').value=nextNo(d).no;['cn','cm','cg','ca','nt'].forEach(i=>$(i).value='');$('ds').value=0;$('gr').value=5;$('pm').value='Cash';items=[{d:'',q:1,r:0,s:''}];rows();tab(1)}
function save(p){const b=collect();if(!b.cn.trim()||!b.items.length||calc(b).tot<=0){alert('Enter customer name and at least one item with a rate.');return}
const a=db();if(editId){const i=a.findIndex(x=>x.id===editId);b.fy=a[i].fy;b.seq=a[i].seq;b.id=editId;a[i]=b}else{const n=nextNo(b.date);b.id='b'+Date.now();b.fy=n.fy;b.seq=n.seq;b.no=n.no;a.push(b);editId=b.id}
if(!wr(a))return;$('no').value=b.no;pv();if(p)setTimeout(()=>{window.print();if($('aw').checked)sharePdf()},100);else alert('Saved: '+b.no)}
function wa(){const b=collect(),c=calc(b);let n=(b.cm||'').replace(/\D/g,'');if(n.length<10){alert('Enter a valid customer mobile number first.');return}n='91'+n.slice(-10);
const t='*'+S.n+'*\nGSTIN: '+S.g+'\n\nTax Invoice: *'+b.no+'*\nDate: '+b.date.split('-').reverse().join('/')+'\nCustomer: '+b.cn+'\n\n'+b.items.map((x,i)=>(i+1)+'. '+x.d+' x '+x.q+' = Rs.'+f2(x.q*x.r)).join('\n')+(b.ds?'\nDiscount: Rs.'+f2(b.ds):'')+'\n\n*Total (incl. GST): Rs.'+f2(c.tot)+'*\nPayment: '+b.pm+'\n\nThank you for shopping with us!\n'+S.n+' | '+S.m;
const url='https://wa.me/'+n+'?text='+encodeURIComponent(t),w=window.open(url,'_blank');if(!w)location.href=url}
async function mkPdf(){pv();const cv=await html2canvas($('inv'),{scale:2,backgroundColor:'#ffffff'});const pdf=new window.jspdf.jsPDF('p','mm','a4');let w=194,h=cv.height*w/cv.width;if(h>281){w=w*281/h;h=281}pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',(210-w)/2,8,w,h);return pdf.output('blob')}
async function sharePdf(btn,mode){const b=collect();if(!b.cn.trim()||!b.items.length){alert('Fill in the bill first.');return}
const nm=(b.no||'bill').replace(/\//g,'-')+'.pdf',old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='Making PDF…'}
let blob;try{blob=await mkPdf()}catch(e){alert('Could not create the PDF. Check your internet connection and try again.');if(btn){btn.disabled=false;btn.textContent=old}return}
if(btn){btn.disabled=false;btn.textContent=old}
const chat=mode==='chat'&&(b.cm||'').replace(/\D/g,'').length>=10;
try{const f=new File([blob],nm,{type:'application/pdf'});if(!chat&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:b.no,text:'Invoice '+b.no+' - '+S.n});return}}catch(e){if(e&&e.name==='AbortError')return}
try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:nm,data:blob});}else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=nm;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),8000)}}catch(e){if(e&&e.code==='declined')return}
wa()}
function list(){const q=$('q').value.toLowerCase(),a=db().sort((x,y)=>y.date.localeCompare(x.date)||y.seq-x.seq).filter(b=>(b.no+b.cn+b.cm).toLowerCase().includes(q));
$('sum').textContent=a.length+' bills | Total ₹ '+f2(a.reduce((s,b)=>s+calc(b).tot,0));
$('rl').innerHTML=a.map(b=>`<tr><td>${esc(b.no)}</td><td>${b.date.split('-').reverse().join('/')}</td><td>${esc(b.cn)}</td><td>${esc(b.cm)}</td><td class="r">${f2(calc(b).tot)}</td><td><button onclick="openB('${b.id}')">Open / Print</button> <button class="d" data-del="${b.id}" onclick="del('${b.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No records yet</td></tr>'}
function openB(id){const b=db().find(x=>x.id===id);if(!b)return;editId=id;$('no').value=b.no;$('dt').value=b.date;$('cn').value=b.cn;$('cm').value=b.cm;$('cg').value=b.cg;$('ca').value=b.ca;$('pm').value=b.pm;$('ds').value=b.ds;$('gr').value=b.gr;$('nt').value=b.nt;items=b.items;rows();tab(1);scrollTo(0,0)}
let delArm=null;
function del(id,btn){
if(delArm!==id){delArm=id;list();const nb=document.querySelector('button[data-del="'+id+'"]');if(nb){nb.textContent='Tap again to confirm';nb.style.background='var(--dg)';nb.style.color='#fff'}
setTimeout(()=>{if(delArm===id){delArm=null;if($('s2').style.display!=='none')list()}},4000);return}
delArm=null;if(wr(db().filter(x=>x.id!==id))){if(editId===id)editId=null;list()}}
async function xl(){
const msg=t=>{$('sum').textContent=t};
const a=db().sort((x,y)=>x.date.localeCompare(y.date)||x.seq-y.seq);
if(!a.length){msg('No records to export yet.');return}
if(!window.XLSX){msg('Excel library could not load. Check your internet connection and try again.');return}
const dm=d=>d?d.split('-').reverse().join('/'):'';
const bills=[],its=[];
a.forEach(b=>{const c=calc(b);
bills.push({'Invoice No':b.no,'Date':dm(b.date),'Customer':b.cn,'Mobile':b.cm,'Customer GSTIN':b.cg||'','Address':b.ca||'','Payment':b.pm,'Items':b.items.map(x=>x.d+' x'+x.q).join('; '),'Gross (₹)':c.sub,'Discount (₹)':b.ds,'GST %':b.gr,'Taxable Value (₹)':Math.round(c.tx*100)/100,'CGST (₹)':Math.round(c.h*100)/100,'SGST (₹)':Math.round(c.h*100)/100,'Round Off (₹)':Math.round(c.ro*100)/100,'Total (₹)':c.tot,'Note':b.nt||''});
b.items.forEach(x=>its.push({'Invoice No':b.no,'Date':dm(b.date),'Customer':b.cn,'Description':x.d,'Chassis / Battery No':x.s||'','Qty':x.q,'Rate (₹)':x.r,'Amount (₹)':x.q*x.r}))});
bills.push({'Invoice No':'TOTAL','Total (₹)':a.reduce((s,b)=>s+calc(b).tot,0)});
const wb=XLSX.utils.book_new(),w1=XLSX.utils.json_to_sheet(bills),w2=XLSX.utils.json_to_sheet(its);
w1['!cols']=[16,11,22,13,18,28,13,50,12,12,8,16,11,11,11,12,20].map(w=>({wch:w}));
w2['!cols']=[16,11,22,55,22,6,11,12].map(w=>({wch:w}));
XLSX.utils.book_append_sheet(wb,w1,'Bills');XLSX.utils.book_append_sheet(wb,w2,'Items');
const nm='SU-Bills-Backup-'+new Date().toISOString().slice(0,10)+'.xlsx';
const blob=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:nm,data:blob});msg('Excel backup saved: '+nm);return}}catch(e){if(e&&e.code==='declined')return}
const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=nm;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);msg('Excel backup downloaded: '+nm)}
async function xr(inp){
const msg=t=>{$('sum').textContent=t};const f=inp.files[0];inp.value='';if(!f)return;
if(!window.XLSX){msg('Excel library could not load. Check your internet connection and try again.');return}
try{
const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
const bs=wb.Sheets['Bills'],is=wb.Sheets['Items'];
if(!bs||!is){msg('This is not a backup file made by this page (Bills and Items sheets not found).');return}
const iso=v=>{if(v==null||v==='')return'';if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10)}
v=String(v).trim();let m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return v.slice(0,10)};
const s=v=>v==null?'':String(v);
